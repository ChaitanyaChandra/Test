name: System Info Summary

on:
  workflow_dispatch:

  
jobs:
  get-timestamp:
    name: "📋 [1/2] Timestamp"
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.ts.outputs.timestamp }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: execute tests
        id: execute_tests
        shell: bash
        run: |
          chmod +x ./shell/gh/code.sh
          bash ./shell/gh/code.sh
        

      - name: Capture & append hostname row
        id: hn
        run: |
          HN=$(hostname)
          echo "hostname=$HN" >> "$GITHUB_OUTPUT"

          # Append directly to step 1's summary file so the row lands inside the same table
          echo "| Hostname | '$HN' | Success |" >> "${{ steps.execute_tests.outputs.summary_file }}"

          echo "✅ Hostname row appended: $HN"
