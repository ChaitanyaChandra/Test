name: System Info Summary

on:
  workflow_dispatch:

  
jobs:

  generate_files:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.get_files.outputs.timestamp }}
      hostname: ${{ steps.get_files.outputs.hostname }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get files
        id: get_files
        run: |
          echo "timestamp=$(date)" >> "$GITHUB_OUTPUT"
          echo "hostname=$(hostname)" >> "$GITHUB_OUTPUT"

  copy-files-jump1:
    runs-on: ubuntu-latest
    needs: generate_files
    steps:
      - name: copy files to jump1
        env: 
          jump1_ssh: ${{ secrets.JUMP1 }}
          host: ${{ vars.HOST1 }}
          timestamp_content: ${{ needs.generate_files.outputs.timestamp }}
          hostname_content: ${{ needs.generate_files.outputs.hostname }}
        id: copy_jump1
        run: |
          if [ -z "$jump1_ssh" ]; then
            echo "jump1 key not found in secrets"
            exit 1
          fi
          
          # Recreate files locally
          FILES_DIR=$(mktemp -d)
          echo "$timestamp_content" > "$FILES_DIR/timestamp.txt"
          echo "$hostname_content" > "$FILES_DIR/hostname.txt"
          
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$jump1_ssh" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Copy files via scp
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$FILES_DIR"/* "root@$host:/tmp/"
          
          # Clean up
          rm -rf "$FILES_DIR" ~/.ssh/id_rsa
          
  copy-files-jump2:
    runs-on: ubuntu-latest
    needs: generate_files
    steps:
      - name: copy files to jump2
        env: 
          jump2_ssh: ${{ secrets.JUMP2 }}
          host: ${{ vars.HOST2 }}
          timestamp_content: ${{ needs.generate_files.outputs.timestamp }}
          hostname_content: ${{ needs.generate_files.outputs.hostname }}
        id: copy_jump2
        run: |
          if [ -z "$jump2_ssh" ]; then
            echo "jump2 key not found in secrets"
            exit 1
          fi
          
          # Recreate files locally
          FILES_DIR=$(mktemp -d)
          echo "$timestamp_content" > "$FILES_DIR/timestamp.txt"
          echo "$hostname_content" > "$FILES_DIR/hostname.txt"
          
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$jump2ssh" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Copy files via scp
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$FILES_DIR"/* "root@$host:/tmp/"
          
          # Clean up
          rm -rf "$FILES_DIR" ~/.ssh/id_rsa