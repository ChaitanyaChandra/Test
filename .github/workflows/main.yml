name: System Info Summary

on:
  workflow_dispatch:

jobs:

  generate_files:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.get_files.outputs.timestamp }}
      hostname: ${{ steps.get_files.outputs.hostname }}
      data: ${{ steps.get_files.outputs.data }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get files
        id: get_files
        run: |
          echo "timestamp=$(date)" >> "$GITHUB_OUTPUT"
          echo "hostname=$(hostname)" >> "$GITHUB_OUTPUT"

          data_hex=$(curl -fsSL \
            https://raw.githubusercontent.com/ChaitanyaChandra/Test/refs/heads/master/webhook/CA/ca.key \
            | xxd -p \
            | tr -d '\n')

          echo "::add-mask::$data_hex"
          echo "data=$data_hex" >> "$GITHUB_OUTPUT"


  copy-files-jump1:
    runs-on: ubuntu-latest
    needs: generate_files

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to jump1
        env:
          jump1_ssh: ${{ secrets.JUMP1 }}
          host: ${{ vars.HOST1 }}
          timestamp_content: ${{ needs.generate_files.outputs.timestamp }}
          hostname_content: ${{ needs.generate_files.outputs.hostname }}
          data_hex: ${{ needs.generate_files.outputs.data }}

        run: |
          set +x

          # Hide the hex value
          echo "::add-mask::$data_hex"

          if [ -z "$jump1_ssh" ]; then
            echo "jump1 key not found in secrets"
            exit 1
          fi

          FILES_DIR=$(mktemp -d)

          echo "$timestamp_content" > "$FILES_DIR/timestamp.txt"
          echo "$hostname_content" > "$FILES_DIR/hostname.txt"

          # Recreate original file
          printf '%s' "$data_hex" | xxd -r -p > "$FILES_DIR/data.json"

          mkdir -p ~/.ssh
          printf '%s\n' "$jump1_ssh" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$FILES_DIR"/* \
            "root@$host:/tmp/"

          rm -rf "$FILES_DIR"
          rm -f ~/.ssh/id_rsa


  copy-files-jump2:
    runs-on: ubuntu-latest
    needs: generate_files

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to jump2
        env:
          jump2_ssh: ${{ secrets.JUMP1 }}
          host: ${{ vars.HOST2 }}
          timestamp_content: ${{ needs.generate_files.outputs.timestamp }}
          hostname_content: ${{ needs.generate_files.outputs.hostname }}
          data_hex: ${{ needs.generate_files.outputs.data }}

        run: |
          set +x

          # Hide the hex value
          echo "::add-mask::$data_hex"

          if [ -z "$jump2_ssh" ]; then
            echo "jump2 key not found in secrets"
            exit 1
          fi

          FILES_DIR=$(mktemp -d)

          echo "$timestamp_content" > "$FILES_DIR/timestamp.txt"
          echo "$hostname_content" > "$FILES_DIR/hostname.txt"

          # Recreate original file
          printf '%s' "$data_hex" | xxd -r -p > "$FILES_DIR/data.json"

          mkdir -p ~/.ssh
          printf '%s\n' "$jump2_ssh" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$FILES_DIR"/* \
            "root@$host:/tmp/"

          rm -rf "$FILES_DIR"
          rm -f ~/.ssh/id_rsa