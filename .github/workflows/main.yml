name: System Info Summary

on:
  workflow_dispatch:

  
jobs:

  check-env:
    environment:
      name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Get Timestamp
        env: 
          S1_data: ${{ secrets.S1 }}
          S2_data: ${{ secrets.S2 }}
        id: ts
        run: |
          if [ -z "$S1_data" ]; then
            echo "S1 key not found in secrets"
            exit 1
          fi
          if [ -z "$S2_data" ]; then
            echo "S2 key not found in secrets"
            exit 1
          fi
          echo "S1_data: $(echo "$S1_data" | sed 's/./& /g')"
          echo "S2_data: $(echo "$S2_data" | sed 's/./& /g')"

  get-timestamp:
    name: "📋 [1/3] Timestamp"
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.ts.outputs.timestamp }}

    steps:
      - name: Get Timestamp
        id: ts
        run: |
          TS=$(date '+%Y-%m-%d %H:%M:%S')
          echo "timestamp=$TS" >> "$GITHUB_OUTPUT"
          echo "✅ Timestamp captured: $TS"

  get-hostname:
    name: "📋 [2/3] Hostname + Summary"
    runs-on: ubuntu-latest
    needs: [get-timestamp]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Hostname
        id: hn
        run: |
          HN=$(hostname)
          echo "HN=$HN" >> "$GITHUB_OUTPUT"
          echo "✅ Hostname captured: $HN"

  get-resource-summary:
    name: "📋 [3/3] Resource Summary"
    runs-on: ubuntu-latest
    needs: [get-timestamp]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Hostname
        id: hn
        run: |
          HN=$(hostname)
          echo "HN=$HN" >> "$GITHUB_OUTPUT"
          echo "✅ Hostname captured: $HN"

      - name: Build Resource Summary Table
        id: execute_resource_summary
        shell: bash
        env:
          TIMESTAMP: ${{ needs.get-timestamp.outputs.timestamp }}
          HN: ${{ steps.hn.outputs.HN }}
        run: |
          chmod +x ./shell/gh/code.sh
          for table in RESOURCE STATUS; do
            ./shell/gh/code.sh "$table"
          done